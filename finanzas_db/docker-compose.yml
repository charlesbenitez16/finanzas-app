services:
  postgres:
    image: postgres:16-alpine
    container_name: finanzas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finanzas_user
      POSTGRES_PASSWORD: finanzas_pass
      POSTGRES_DB: finanzas_db
    ports:
      - "5433:5432"
    volumes:
      - finanzas_pgdata:/var/lib/postgresql/data
      - ./schema_finanzas.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas_user -d finanzas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finanzas_pgdata:
